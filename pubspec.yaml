name: hsk4_grammar_offline_app
description: A cross-platform HSK4 grammar learning app by NJTECH oversees college students.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^4.0.0

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.0
  shared_preferences: ^2.2.2
  lottie: ^2.6.0
  scratcher: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


  assets:
    - assets/data/hsk_words.json
    - assets/data/hsk_grammar.json
    - assets/animations/education_edit.json

